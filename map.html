<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07110a">
<title>Карта Чернаруси // CHERNARUS TALES</title>
<style>
:root{color-scheme:dark;--g:#9ed6a2;--bg:#07110a;--panel:#101d14;--line:#34563a}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#d0ded1;font:13px "Courier New",monospace}
body{display:flex;flex-direction:column}
.top{min-height:46px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:#0b170e;border-bottom:1px solid var(--line);color:var(--g)}
.brand{font-size:11px;letter-spacing:1px;font-weight:bold}
.actions{display:flex;align-items:center;gap:8px}
.source{font-size:10px;color:#aab9ab;text-align:right}
a{color:var(--g);text-decoration:none}
a:hover{text-decoration:underline}
.open{border:1px solid var(--line);padding:7px 10px;background:#142319;color:var(--g);font:11px "Courier New";white-space:nowrap}
.map{position:relative;flex:1;min-height:0;background:#101810}
iframe{display:block;width:100%;height:100%;border:0;background:#101810}
.notice{padding:6px 10px;border-top:1px solid var(--line);background:#0b170e;color:#91a493;font-size:10px;line-height:1.4}
@media(max-width:520px){.top{align-items:flex-start}.brand{max-width:42%;line-height:1.5}.source{font-size:9px}.open{padding:7px 8px;font-size:10px}.notice{font-size:9px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand" id="brand">CHERNARUS TALES // КАРТА</div>
  <div class="actions">
    <div class="source" id="source">Карта: iZurvive<br>DayZ / Bohemia Interactive</div>
    <a class="open" id="openMap" href="https://www.izurvive.com/chernarusplus/" target="_blank" rel="noopener noreferrer">ОТКРЫТЬ iZURVIVE ↗</a>
  </div>
</header>
<main class="map">
  <iframe id="izurvive" src="https://www.izurvive.com/chernarusplus/" title="Интерактивная карта Чернаруси iZurvive" loading="eager" referrerpolicy="strict-origin-when-cross-origin" allow="fullscreen"></iframe>
</main>
<footer class="notice" id="notice">Источник карты: iZurvive — <a href="https://www.izurvive.com/chernarusplus/" target="_blank" rel="noopener noreferrer">izurvive.com</a>. Карта и её обозначения принадлежат соответствующим правообладателям; отображаются оригинальные материалы и атрибуция источника.</footer>
<script>
(function(){
  const en=localStorage.getItem('ct_language')==='en';
  document.documentElement.lang=en?'en':'ru';
  document.getElementById('brand').textContent=en?'CHERNARUS TALES // MAP':'CHERNARUS TALES // КАРТА';
  document.getElementById('source').innerHTML=en?'Map source: iZurvive<br>DayZ / Bohemia Interactive':'Карта: iZurvive<br>DayZ / Bohemia Interactive';
  document.getElementById('openMap').textContent=en?'OPEN iZURVIVE ↗':'ОТКРЫТЬ iZURVIVE ↗';
  document.getElementById('notice').innerHTML=en?'Map source: iZurvive — <a href="https://www.izurvive.com/chernarusplus/" target="_blank" rel="noopener noreferrer">izurvive.com</a>. Map artwork and labels belong to their respective rights holders; original map content and attribution are retained.':'Источник карты: iZurvive — <a href="https://www.izurvive.com/chernarusplus/" target="_blank" rel="noopener noreferrer">izurvive.com</a>. Карта и её обозначения принадлежат соответствующим правообладателям; отображаются оригинальные материалы и атрибуция источника.';
})();
</script>
</body>
</html>
