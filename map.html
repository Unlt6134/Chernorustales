<style>
:root{color-scheme:dark;--g:#9ed6a2;--bg:#07110a;--panel:#101d14;--line:#34563a}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#d0ded1;font:13px "Courier New",monospace}
body{display:flex;flex-direction:column}.bar{height:42px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#0b170e;border-bottom:1px solid var(--line);letter-spacing:1px;color:var(--g);font-size:11px}
.viewport{position:relative;flex:1;overflow:hidden;background:#101810;touch-action:none;cursor:grab}.viewport:active{cursor:grabbing}
#mapLayer{position:absolute;left:50%;top:50%;width:min(100vw,calc(100vh - 42px));aspect-ratio:1;transform:translate(-50%,-50%) scale(1);transform-origin:center;user-select:none;pointer-events:none}
#paper{display:block;width:100%;height:100%;object-fit:contain;-webkit-user-drag:none}
#labels{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#labels text{font-family:"Courier New",monospace;text-anchor:middle;paint-order:stroke;stroke:#07110a;stroke-width:58;stroke-linejoin:round;fill:#b5e0b5;letter-spacing:5px}
#labels .city{font-size:205px;font-weight:bold;fill:#c4efc2;stroke-width:68}
#labels .village{font-size:145px;fill:#a9d3ac;opacity:.92}
.controls{position:absolute;right:10px;top:10px;z-index:2;display:flex;flex-direction:column;gap:5px}
button{background:#0b170eeb;color:var(--g);border:1px solid var(--line);min-width:38px;height:38px;font:18px "Courier New";border-radius:2px}
.labels-hidden #labels{display:none}
@media(min-width:900px){.bar{height:46px}}
</style>
</head>

<div class="controls"><button id="plus" aria-label="Приблизить" title="Приблизить">+</button><button id="minus" aria-label="Отдалить" title="Отдалить">−</button><button id="reset" aria-label="Сбросить масштаб" title="Сбросить масштаб">⌂</button><button id="toggleLabels" aria-label="Скрыть все названия" title="Скрыть все названия">A</button></div>

<script>
(()=>{const v=document.getElementById('viewport'),layer=document.getElementById('mapLayer'),img=document.getElementById('paper'),label=document.getElementById('zoomLabel'),toggle=document.getElementById('toggleLabels');let scale=1,tx=0,ty=0,pts=new Map(),drag=null,pinch=null,labelsVisible=true;
function paint(){layer.style.transform='translate(calc(-50% + '+tx+'px),calc(-50% + '+ty+'px)) scale('+scale+')';label.textContent=Math.round(scale*100)+'%'}
function clamp(){scale=Math.max(.35,Math.min(8,scale))}
function point(e){const r=v.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function mid(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
v.addEventListener('pointerdown',e=>{v.setPointerCapture(e.pointerId);pts.set(e.pointerId,point(e));if(pts.size===2){const a=[...pts.values()];pinch={d:dist(a[0],a[1]),scale,mid:mid(a[0],a[1]),tx,ty};drag=null}else if(pts.size===1){drag={id:e.pointerId,p:point(e),tx,ty}}});
v.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,point(e));if(pts.size>=2&&pinch){const a=[...pts.values()],m=mid(a[0],a[1]),factor=dist(a[0],a[1])/Math.max(1,pinch.d);scale=pinch.scale*factor;clamp();const rect=v.getBoundingClientRect(),cx=rect.width/2,cy=rect.height/2,ratio=scale/pinch.scale;tx=m.x-cx-(pinch.mid.x-cx-pinch.tx)*ratio;ty=m.y-cy-(pinch.mid.y-cy-pinch.ty)*ratio;paint()}else if(drag&&drag.id===e.pointerId){const p=point(e);tx=drag.tx+p.x-drag.p.x;ty=drag.ty+p.y-drag.p.y;paint()}});
function end(e){pts.delete(e.pointerId);if(pinch){pinch=null;drag=null;if(pts.size===1){const [id,p]=[...pts.entries()][0];drag={id,p,tx,ty}}}else if(drag&&drag.id===e.pointerId)drag=null}
v.addEventListener('pointerup',end);v.addEventListener('pointercancel',end);
v.addEventListener('wheel',e=>{e.preventDefault();const old=scale;scale*=e.deltaY<0?1.15:1/1.15;clamp();const r=v.getBoundingClientRect(),p=point(e);tx=p.x-r.width/2-(p.x-r.width/2-tx)*scale/old;ty=p.y-r.height/2-(p.y-r.height/2-ty)*scale/old;paint()},{passive:false});
document.getElementById('plus').onclick=()=>{scale*=1.25;clamp();paint()};document.getElementById('minus').onclick=()=>{scale/=1.25;clamp();paint()};document.getElementById('reset').onclick=()=>{scale=1;tx=ty=0;paint()};toggle.onclick=()=>{labelsVisible=!labelsVisible;v.classList.toggle('labels-hidden',!labelsVisible);toggle.textContent=labelsVisible?'A':'A̸';toggle.setAttribute('aria-label',labelsVisible?'Скрыть все названия':'Показать все названия');toggle.title=labelsVisible?'Скрыть все названия':'Показать все названия'};
img.addEventListener('load',()=>{scale=1;tx=ty=0;paint()});paint();
})();
</script>
