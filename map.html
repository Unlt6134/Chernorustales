<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07110a">
<title>Карта Чернаруси // CHERNARUS TALES</title>
<style>
:root{color-scheme:dark;--g:#9ed6a2;--bg:#07110a;--line:#34563a;--muted:#9aab9c}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:var(--bg);color:#d0ded1;font:13px "Courier New",monospace}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.top{min-height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 14px;background:#0b170e;border-bottom:1px solid var(--line);color:var(--g)}
.brand{font-size:11px;letter-spacing:1.2px;font-weight:bold;white-space:nowrap}
.actions{display:flex;align-items:center;gap:12px;min-width:0}
.source{font-size:10px;color:var(--muted);text-align:right;line-height:1.45}
a{color:var(--g);text-decoration:none}a:hover{text-decoration:underline}
.open{border:1px solid var(--line);padding:8px 11px;background:#142319;color:var(--g);font:11px "Courier New";white-space:nowrap;border-radius:3px}
.map{position:relative;flex:1;min-height:0;background:#101810;overflow:hidden}
iframe{display:block;width:100%;height:100%;border:0;background:#101810}
.notice{flex:none;padding:7px 12px;border-top:1px solid var(--line);background:#0b170e;color:#91a493;font-size:10px;line-height:1.4}
@media(max-width:640px){.top{min-height:52px;padding:7px 10px;gap:8px}.brand{font-size:10px;letter-spacing:.65px;max-width:48%;white-space:normal;line-height:1.35}.actions{gap:7px}.source{display:none}.open{padding:9px 10px;font-size:10px;min-height:36px}.notice{padding:5px 9px;font-size:9px;line-height:1.3}}
@media(max-width:360px){.brand{font-size:9px}.open{font-size:9px;padding:8px}}


/* Единый размер шрифта на всём сайте */
html, body, body * {
  font-size: 14px !important;
}
</style>
</head>
<body>
<header class="top">
<div class="brand" id="brand">CHERNARUS TALES // КАРТА</div>
<div class="actions">
<div class="source" id="source">Карта: iZurvive<br>DayZ / Bohemia Interactive</div>
<a class="open" id="openMap" href="https://www.izurvive.com/chernarusplus/" target="_blank" rel="noopener noreferrer">ОТКРЫТЬ iZURVIVE ↗</a>
</div>
</header>
<main class="map">
<iframe id="izurvive" src="https://www.izurvive.com/chernarusplus/" title="Интерактивная карта Чернаруси iZurvive" loading="eager" referrerpolicy="strict-origin-when-cross-origin" allow="fullscreen; geolocation"></iframe>
</main>
<footer class="notice" id="notice">Источник карты: iZurvive — <a href="https://www.izurvive.com/chernarusplus/" target="_blank" rel="noopener noreferrer">izurvive.com</a>. Карта и её обозначения принадлежат соответствующим правообладателям; отображаются оригинальные материалы и атрибуция источника.</footer>
<script>
(function(){
function refreshLanguage(lang){
const en=(lang||localStorage.getItem('ct_language'))==='en';
document.documentElement.lang=en?'en':'ru';
document.getElementById('brand').textContent=en?'CHERNARUS TALES // MAP':'CHERNARUS TALES // КАРТА';
document.getElementById('source').innerHTML=en?'Map source: iZurvive<br>DayZ / Bohemia Interactive':'Карта: iZurvive<br>DayZ / Bohemia Interactive';
document.getElementById('openMap').textContent=en?'OPEN iZURVIVE ↗':'ОТКРЫТЬ iZURVIVE ↗';
document.getElementById('notice').innerHTML=en?'Map source: iZurvive — <a href="https://www.izurvive.com/chernarusplus/" target="_blank" rel="noopener noreferrer">izurvive.com</a>. Map artwork and labels belong to their respective rights holders; original map content and attribution are retained.':'Источник карты: iZurvive — <a href="https://www.izurvive.com/chernarusplus/" target="_blank" rel="noopener noreferrer">izurvive.com</a>. Карта и её обозначения принадлежат соответствующим правообладателям; отображаются оригинальные материалы и атрибуция источника.';
}
refreshLanguage();
window.addEventListener('message',e=>{if(e.data&&e.data.type==='ct-language-change')refreshLanguage(e.data.lang)});
window.addEventListener('storage',e=>{if(e.key==='ct_language')refreshLanguage(e.newValue)});
})();
</script>
</body>
</html>
